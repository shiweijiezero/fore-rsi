[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.13,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "fore-rsi"
version = "0.0.1"
description = "An RSI framework for agent teams that explore, execute, and improve through feedback."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "terminal/LICENSE",
    "terminal/vendor/libghostty-vt/LICENSE",
    "terminal/vendor/portable-pty/LICENSE.md",
]
dependencies = [
    "anyio>=4.9,<5",
    "httpx2>=2.10,<3",
    "jinja2>=3.1.6,<4",
    "loguru>=0.8,<1",
    "mcp>=2.3.0,<3",
    "platformdirs>=4,<5",
    "psutil>=7,<8",
    "pydantic>=2.11,<3",
    "starlette>=0.48,<2",
    "textual>=8.2.8,<9",
    "tyro>=1.0.17,<2",
    "uvicorn>=0.31.1,<1",
    "websockets>=17,<18",
]

[project.scripts]
fore-rsi = "fore_rsi.__main__:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["fore_rsi", "fore_rsi.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["prompts/**/*.j2"]
"fore_rsi.rsi_workflows.agent_runtimes.claude_code" = [
    "turn_events/.claude-plugin/plugin.json",
    "turn_events/hooks/hooks.json",
    "turn_events/hooks/register.js",
    "turn_events/hooks/input_stream.py",
]
