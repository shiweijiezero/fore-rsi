[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fore-rsi"
version = "0.0.1"
description = "A Python command-line interface for ForeRSI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
fore-rsi = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "config", "config_validator"]
