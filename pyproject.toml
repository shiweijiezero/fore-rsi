[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fore-rsi"
version = "0.0.1"
description = "An RSI framework for agent teams that explore, execute, and improve through feedback."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["tyro>=1.0.17,<2"]

[project.scripts]
fore-rsi = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "config"]
